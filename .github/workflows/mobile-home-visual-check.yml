name: Mobile home visual check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-home:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Start Marbella For Sale
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/mfs-dev.log 2>&1 &
          echo $! > /tmp/mfs-dev.pid
          for attempt in {1..75}; do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/mfs-dev.log
          exit 1
      - name: Capture and measure 390x844
        shell: bash
        run: |
          mkdir -p artifacts/marbella-for-sale/mobile
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 1,
            isMobile: true,
            hasTouch: true,
            reducedMotion: 'no-preference'
          });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', error => errors.push(error.message));
          page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });
          await page.goto('http://127.0.0.1:5173/', { waitUntil: 'networkidle' });
          await page.evaluate(() => document.fonts.ready);
          await page.screenshot({ path: 'artifacts/marbella-for-sale/mobile/marbella-for-sale-home-hero-mobile-after.png', fullPage: false, animations: 'disabled' });
          const metrics = await page.evaluate(() => {
            const rect = selector => {
              const element = document.querySelector(selector);
              if (!element) return null;
              const box = element.getBoundingClientRect();
              return { left: box.left, top: box.top, right: box.right, bottom: box.bottom, width: box.width, height: box.height };
            };
            const logo = rect('.morph-wordmark');
            const title = rect('.hero h1');
            const eyebrow = rect('.hero-content .eyebrow');
            const cta = rect('.hero-primary');
            const search = rect('.hero-search');
            const hero = rect('.hero');
            const intersects = (a, b) => Boolean(a && b && a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top);
            return {
              viewport: { width: innerWidth, height: innerHeight },
              documentWidth: document.documentElement.scrollWidth,
              hero, logo, eyebrow, title, cta, search,
              logoTitleOverlap: intersects(logo, title),
              titleCtaOverlap: intersects(title, cta),
              ctaInsideViewport: Boolean(cta && cta.left >= 0 && cta.right <= innerWidth && cta.top >= 0 && cta.bottom <= innerHeight),
              searchHidden: getComputedStyle(document.querySelector('.hero-search')).display === 'none',
              horizontalOverflow: document.documentElement.scrollWidth > innerWidth,
              frameworkOverlay: Boolean(document.querySelector('[data-nextjs-dialog], .vite-error-overlay, #webpack-dev-server-client-overlay'))
            };
          });
          await page.evaluate(() => scrollTo(0, 380));
          await page.waitForTimeout(350);
          metrics.afterScroll = await page.evaluate(() => {
            const box = document.querySelector('.morph-wordmark').getBoundingClientRect();
            const header = document.querySelector('.site-header');
            return {
              logo: { left: box.left, top: box.top, right: box.right, bottom: box.bottom, width: box.width, height: box.height },
              headerScrolled: header.classList.contains('is-scrolled'),
              logoTransform: document.querySelector('.morph-wordmark').style.transform
            };
          });
          await page.screenshot({ path: 'artifacts/marbella-for-sale/mobile/marbella-for-sale-home-mobile-after-scroll.png', fullPage: false, animations: 'disabled' });
          metrics.errors = errors;
          await writeFile('artifacts/marbella-for-sale/mobile/marbella-for-sale-home-hero-mobile-metrics.json', JSON.stringify(metrics, null, 2));
          console.log(JSON.stringify(metrics));
          if (metrics.horizontalOverflow || metrics.logoTitleOverlap || metrics.titleCtaOverlap || !metrics.ctaInsideViewport || !metrics.searchHidden || metrics.frameworkOverlay || errors.length) process.exitCode = 1;
          await browser.close();
          NODE
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marbella-for-sale-mobile-home-${{ github.run_number }}
          path: artifacts/marbella-for-sale/mobile
          retention-days: 14
