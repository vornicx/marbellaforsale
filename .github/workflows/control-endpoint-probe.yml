name: Archic Control Endpoint Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/control-endpoint-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect canonical Control health
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --location \
            -o "$response_file" -w '%{http_code}' \
            'https://archiccontrol.vercel.app/api/health' || true)"
          body="$(cat "$response_file")"
          rm -f "$response_file"
          echo "HTTP $status"
          printf '%s\n' "$body" | jq .
          printf '%s' "$body" | jq -e '.service == "archic-control"' >/dev/null
